# Fine-tunes PaddleOCR's PP-OCRv6_medium_rec text recognition model on pump
# display numbers. Based on configs/rec/PP-OCRv6/PP-OCRv6_medium_rec.yml of
# PaddleOCR v3.7.0; what differs is marked "fine-tune".
#
# Run from the PaddleOCR folder (see scripts/train/README.md):
#   python tools/train.py -c <this file>
Global:
  model_name: PP-OCRv6_medium_rec
  debug: false
  use_gpu: true
  epoch_num: 8                       # fine-tune: short, the model already reads text
  log_smooth_window: 20
  print_batch_step: 50
  save_model_dir: C:/ocr-train/output/pump_rec
  save_epoch_step: 3
  eval_batch_step: [0, 750]
  cal_metric_during_train: true
  pretrained_model: C:/ocr-train/pretrained/PP-OCRv6_medium_rec_pretrained   # fine-tune: start from the released weights
  checkpoints:
  save_inference_dir:
  use_visualdl: false
  infer_img:
  character_dict_path: ppocr/utils/dict/ppocrv6_dict.txt   # unchanged, so it still reads words such as SAR/L
  max_text_length: &max_text_length 25
  infer_mode: false
  use_space_char: true
  distributed: false
  save_res_path: C:/ocr-train/output/pump_rec/predicts.txt
  d2s_train_image_shape: [3, 48, 320]

Optimizer:
  name: Adam
  beta1: 0.9
  beta2: 0.999
  lr:
    name: Cosine
    learning_rate: 0.0001            # fine-tune: 5x lower than training from scratch
    warmup_epoch: 1
  regularizer:
    name: L2
    factor: 3.0e-05

Architecture:
  model_type: rec
  algorithm: SVTR_LCNet
  Transform:
  Backbone:
    name: PPLCNetV4
    model_size: medium
  Head:
    name: MultiHead
    head_list:
      - CTCHead:
          Neck:
            name: lightsvtr
            dims: 192
            depth: 2
            mlp_ratio: 4.0
            local_kernel: 7
            use_guide: false
          Head:
            fc_decay: 0.00001
      - NRTRHead:
          nrtr_dim: 512
          max_text_length: *max_text_length

Loss:
  name: MultiLoss
  loss_config_list:
    - CTCLoss:
    - NRTRLoss:

PostProcess:
  name: CTCLabelDecode

Metric:
  name: RecMetric
  main_indicator: acc

Train:
  dataset:
    name: MultiScaleDataSet
    ds_width: false
    data_dir: C:/ocr-train/data/
    ext_op_transform_idx: 1
    label_file_list:
    - C:/ocr-train/data/train_list.txt
    ratio_list:
    - 1.0
    transforms:
    - DecodeImage:
        img_mode: BGR
        channel_first: false
    - RecConAug:
        prob: 0.2                    # fine-tune: mostly single numbers, as on a display
        ext_data_num: 2
        image_shape: [48, 320, 3]
        max_text_length: *max_text_length
    - RecAug:
    - MultiLabelEncode:
        gtc_encode: NRTRLabelEncode
    - KeepKeys:
        keep_keys:
        - image
        - label_ctc
        - label_gtc
        - length
        - valid_ratio
  sampler:
    name: MultiScaleSampler
    scales: [[320, 32], [320, 48], [320, 64]]
    first_bs: &bs 24                 # fine-tune: 64 needs more than the 8 GB of an RTX 3070
    fix_bs: false
    divided_factor: [8, 16]
    is_training: True
  loader:
    shuffle: true
    batch_size_per_card: *bs
    drop_last: true
    num_workers: 4

Eval:
  dataset:
    name: SimpleDataSet
    data_dir: C:/ocr-train/data/
    label_file_list:
    - C:/ocr-train/data/val_list.txt
    transforms:
    - DecodeImage:
        img_mode: BGR
        channel_first: false
    - MultiLabelEncode:
        gtc_encode: NRTRLabelEncode
    - RecResizeImg:
        image_shape: [3, 48, 320]
    - KeepKeys:
        keep_keys:
        - image
        - label_ctc
        - label_gtc
        - length
        - valid_ratio
  loader:
    shuffle: false
    drop_last: false
    batch_size_per_card: 128
    num_workers: 2
