<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0b0c0e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="icon" href="data:,">
<title>Pump scan</title>
<style>
  :root {
    --bg: #0b0c0e;
    --glass: rgba(16, 18, 22, 0.74);
    --line: rgba(255, 255, 255, 0.12);
    --text: #f4f5f7;
    --muted: #a6acb8;
    --accent: #34d399;
    --ok: #4ade80;
    --warn: #facc15;
    --bad: #fb923c;
    --top: env(safe-area-inset-top, 0px);
    --bottom: env(safe-area-inset-bottom, 0px);
    /* The framing box: as wide as the screen allows, but never so tall that
       it reaches the controls. Everything fits on one screen, no scrolling. */
    --roi: min(84vw, 420px, calc(100dvh - var(--top) - var(--bottom) - 226px));
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    height: 100%; margin: 0; overflow: hidden; overscroll-behavior: none;
    background: var(--bg); color: var(--text); touch-action: manipulation;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased; -webkit-user-select: none; user-select: none;
  }
  [hidden] { display: none !important; }

  #app { position: fixed; inset: 0; height: 100dvh; overflow: hidden; }

  /* ---- camera ---- */
  #video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; background: #000; }
  #stage { position: absolute; inset: 0; }
  /* The region of interest. Only this box (plus a small margin) is sent. */
  #roi {
    position: absolute; left: 50%; top: calc(var(--top) + 64px);
    width: var(--roi); height: var(--roi); transform: translateX(-50%);
    border-radius: 22px; box-shadow: 0 0 0 100vmax rgba(4, 5, 7, 0.52);
    overflow: hidden;
  }
  #roi svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  #roi path { fill: none; stroke: #fff; stroke-width: 3.5; stroke-linecap: round;
              vector-effect: non-scaling-stroke; transition: stroke 0.25s; }
  #app[data-state="reading"] #roi path { stroke: var(--accent); }
  /* a line sweeping down the box while the server reads */
  #sweep { position: absolute; left: 0; right: 0; top: 0; height: 28%; opacity: 0;
           background: linear-gradient(180deg, rgba(52, 211, 153, 0), rgba(52, 211, 153, 0.34)); }
  #app[data-state="reading"] #sweep { opacity: 1; animation: sweep 1.1s ease-in-out infinite; }
  @keyframes sweep { from { transform: translateY(-100%); } to { transform: translateY(360%); } }
  /* a short flash at the moment the picture is taken */
  #flash { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; }
  #flash.go { animation: flash 0.32s ease-out; }
  @keyframes flash { from { opacity: 0.55; } to { opacity: 0; } }

  #no-camera { position: absolute; left: 24px; right: 24px; top: calc(var(--top) + 96px);
               text-align: center; color: var(--muted); font-size: 16px; line-height: 1.45; }
  #no-camera svg { width: 56px; height: 56px; margin-bottom: 14px; stroke: var(--muted); }

  /* ---- top bar ---- */
  #top { position: absolute; left: 0; right: 0; top: 0; display: flex; align-items: center; gap: 10px;
         padding: calc(var(--top) + 12px) 14px 0; }
  .pill, .icon { background: rgba(8, 9, 11, 0.5); border: 1px solid var(--line);
                 -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); }
  .pill { flex: 1; min-width: 0; padding: 10px 14px; border-radius: 999px; font-size: 14px;
          line-height: 1.2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-align: center; }
  .icon { display: grid; place-items: center; width: 40px; height: 40px; flex: none; border-radius: 50%; }
  .icon svg { width: 20px; height: 20px; stroke: var(--text); }
  /* the language switch: shows the language it switches to */
  #lang { padding: 0; color: var(--text); font-family: inherit; font-size: 14px; font-weight: 700; cursor: pointer; }
  svg.line { fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

  /* ---- bottom sheet ---- */
  #sheet { position: absolute; left: 0; right: 0; bottom: 0; padding: 12px 16px calc(var(--bottom) + 14px);
           background: var(--glass); border-top: 1px solid var(--line); border-radius: 24px 24px 0 0;
           -webkit-backdrop-filter: blur(24px) saturate(160%); backdrop-filter: blur(24px) saturate(160%);
           transition: transform 0.2s ease; }

  /* result: grows smoothly out of the sheet */
  #result { display: grid; grid-template-rows: 0fr; opacity: 0;
            transition: grid-template-rows 0.3s cubic-bezier(0.2, 0.8, 0.2, 1), opacity 0.22s ease; }
  #result.show { grid-template-rows: 1fr; opacity: 1; }
  #result > div { overflow: hidden; min-height: 0; }
  #result-inner { padding: 2px 2px 14px; }
  .result-main { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
  #result-value { font-size: 42px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.1;
                  font-variant-numeric: tabular-nums; }
  #result-unit { margin-inline-start: 6px; font-size: 18px; font-weight: 600; color: var(--muted); letter-spacing: 0; }
  #result.retake #result-value, #result.error #result-value { font-size: 24px; letter-spacing: 0; }
  /* Arabic letters join up, so they must not be spaced apart or squeezed */
  :lang(ar) * { letter-spacing: 0 !important; }
  .chip { flex: none; padding: 6px 11px; border-radius: 999px; font-size: 13px; font-weight: 600; }
  #result.accepted .chip { color: var(--ok); background: rgba(74, 222, 128, 0.14); }
  #result.review .chip { color: var(--warn); background: rgba(250, 204, 21, 0.14); }
  #result.retake .chip, #result.error .chip { color: var(--bad); background: rgba(251, 146, 60, 0.15); }
  #result-note { margin-top: 4px; font-size: 14px; line-height: 1.35; color: var(--muted); }

  #feedback { margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--line); }
  #feedback .row { display: flex; align-items: center; gap: 10px; }
  #feedback-question { flex: 1; min-width: 0; font-size: 15px; line-height: 1.3; }
  #feedback-entry { margin-top: 10px; }
  .small { height: 40px; padding: 0 18px; border-radius: 12px; border: 1px solid var(--line);
           background: rgba(255, 255, 255, 0.07); color: var(--text); font-family: inherit; font-size: 15px; font-weight: 600; line-height: 1;
           transition: transform 0.12s ease, background 0.2s; }
  .small:active { transform: scale(0.96); }
  .small.yes { color: #06281c; background: var(--accent); border-color: transparent; }
  /* 18px: below 16px an iPhone zooms the whole page when the box is tapped */
  #true-liters { flex: 1; min-width: 0; height: 44px; padding: 0 14px; border-radius: 12px;
                 border: 1px solid var(--line); background: rgba(0, 0, 0, 0.35); color: var(--text);
                 font-family: inherit; font-size: 18px; font-weight: 600; line-height: 1; font-variant-numeric: tabular-nums;
                 -webkit-user-select: text; user-select: text; outline: none; }
  #true-liters:focus { border-color: var(--accent); }
  #true-liters::placeholder { color: #6b7280; font-weight: 500; }

  /* zoom */
  #zoom-row { display: flex; align-items: center; gap: 12px; height: 34px; margin-bottom: 10px;
              font-size: 13px; color: var(--muted); }
  /* the view is frozen once a picture is taken, so zoom makes way for the result */
  #app:not([data-state="live"]) #zoom-row { display: none; }
  #zoom-value { min-width: 3em; text-align: end; color: var(--text); font-weight: 600;
                font-variant-numeric: tabular-nums; }
  #zoom { -webkit-appearance: none; appearance: none; flex: 1; height: 30px; margin: 0; background: transparent; }
  #zoom::-webkit-slider-runnable-track { height: 4px; border-radius: 2px; background: rgba(255, 255, 255, 0.24); }
  #zoom::-webkit-slider-thumb { -webkit-appearance: none; width: 24px; height: 24px; margin-top: -10px;
                                border-radius: 50%; background: #fff; box-shadow: 0 1px 5px rgba(0, 0, 0, 0.45); }
  #zoom::-moz-range-track { height: 4px; border-radius: 2px; background: rgba(255, 255, 255, 0.24); }
  #zoom::-moz-range-thumb { width: 24px; height: 24px; border: 0; border-radius: 50%; background: #fff; }

  /* the main button */
  .primary { display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; height: 54px;
             border: 0; border-radius: 16px; color: #06281c; font-family: inherit; font-size: 18px; font-weight: 650; line-height: 1; cursor: pointer;
             background: linear-gradient(180deg, #6ee7b7, #34d399);
             box-shadow: 0 8px 22px rgba(52, 211, 153, 0.26), inset 0 1px 0 rgba(255, 255, 255, 0.45);
             transition: transform 0.12s ease, filter 0.2s ease; }
  .primary:active { transform: scale(0.975); }
  .primary:disabled { filter: saturate(0.35) brightness(0.82); }
  #spinner { display: none; width: 18px; height: 18px; border-radius: 50%;
             border: 2.5px solid rgba(6, 40, 28, 0.28); border-top-color: #06281c;
             animation: spin 0.7s linear infinite; }
  #app[data-state="reading"] #spinner { display: block; }
  @keyframes spin { to { transform: rotate(360deg); } }
  #photo { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }

  @media (prefers-reduced-motion: reduce) {
    #result, .primary, .small, #sheet { transition: none; }
    #sweep, #flash.go { animation: none; }
  }
</style>
</head>
<body>
<div id="app" data-state="live" data-mode="starting">

  <!-- Live camera with a framing box. Needs HTTPS. -->
  <video id="video" autoplay playsinline muted hidden></video>
  <div id="stage">
    <div id="roi" hidden>
      <svg viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">
        <path d="M2 16 V9 Q2 2 9 2 H16"/><path d="M84 2 H91 Q98 2 98 9 V16"/>
        <path d="M98 84 V91 Q98 98 91 98 H84"/><path d="M16 98 H9 Q2 98 2 91 V84"/>
      </svg>
      <div id="sweep"></div>
      <div id="flash"></div>
    </div>
    <div id="no-camera" hidden>
      <svg class="line" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M4 8h3l1.5-2h7L17 8h3v11H4z"/><circle cx="12" cy="13" r="3.4"/>
      </svg>
      <div><span data-t="no_camera_1"></span><br><span data-t="no_camera_2"></span></div>
    </div>
  </div>

  <header id="top">
    <div id="hint" class="pill"></div>
    <button id="lang" class="icon" type="button"></button>
    <a id="history" class="icon" href="/scans" data-t-label="history">
      <svg class="line" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M3.5 12a8.5 8.5 0 1 0 2.6-6.1"/><path d="M3.5 4.5v4h4"/><path d="M12 7.5V12l3 2"/>
      </svg>
    </a>
  </header>

  <section id="sheet">
    <div id="result" aria-live="polite"><div><div id="result-inner">
      <div class="result-main">
        <div><span id="result-value"></span><span id="result-unit" data-t="unit"></span></div>
        <span id="result-chip" class="chip"></span>
      </div>
      <div id="result-note"></div>

      <!-- Was this right? The answers become labelled test data. -->
      <div id="feedback" hidden>
        <div class="row">
          <div id="feedback-question"></div>
          <div class="row" id="feedback-buttons">
            <button id="feedback-yes" class="small yes" data-t="yes"></button>
            <button id="feedback-no" class="small" data-t="no"></button>
          </div>
        </div>
        <div class="row" id="feedback-entry" hidden>
          <input id="true-liters" inputmode="decimal" data-t-placeholder="placeholder" autocomplete="off" enterkeyhint="done">
          <button id="feedback-save" class="small yes" data-t="save"></button>
        </div>
      </div>
    </div></div></div>

    <div id="zoom-row" hidden>
      <span data-t="zoom"></span>
      <input id="zoom" type="range" min="1" max="5" step="0.1" value="1" dir="ltr" data-t-label="zoom">
      <span id="zoom-value">1.0×</span>
    </div>

    <button id="shoot" class="primary" hidden><span id="spinner"></span><span id="shoot-label"></span></button>
    <!-- Fallback when the live camera is unavailable: the phone's own camera app. -->
    <label id="photo-button" class="primary" for="photo" data-t="take_photo" hidden></label>
    <input id="photo" type="file" accept="image/*" capture="environment">
  </section>
</div>

<script>
const $ = (id) => document.getElementById(id);
const app = $('app'), video = $('video'), stage = $('stage'), roi = $('roi'), hint = $('hint');
const sheet = $('sheet'), shoot = $('shoot'), shootLabel = $('shoot-label');
const result = $('result'), resultValue = $('result-value'), resultUnit = $('result-unit');
const resultChip = $('result-chip'), resultNote = $('result-note');

// Extra area captured around the box, as a fraction of its size, so the
// edge of the display is still in the picture when it touches the box.
const MARGIN = 0.06;
// Longest side, in pixels, of the picture sent to the server.
const SEND_MAX_SIDE = 960;

// ---- words: English and Arabic ---------------------------------------------
// Numbers stay in Western digits in both languages, as on the pump.
const TEXT = {
  en: {
    starting: 'Starting the camera…',
    hint_fit: 'Fit the pump display in the frame',
    hint_photo: 'Take a photo of the pump display',
    hint_again: 'Tap Scan again for a new reading',
    captured: 'Captured. You can lower the phone.',
    reading_photo: 'Reading the photo…',
    scan: 'Scan', scan_again: 'Scan again', reading: 'Reading…', seconds: 's',
    take_photo: 'Take photo',
    no_camera_1: 'The live camera view is not available here.',
    no_camera_2: 'Take a photo of the pump display instead.',
    unit: 'L', zoom: 'Zoom', history: 'Scan history', other_language: 'ع',
    verified: 'Verified', not_verified: 'Not verified', retake: 'Retake', error: 'Error',
    no_reading: 'No reading', not_sent: 'Not sent',
    read_in: (s) => 'Read in ' + s + ' s.',
    unreadable: 'The display could not be read.',
    try_again: 'Move closer or zoom in, then scan again.',
    // Why a result is "review" (liters returned, but not verified).
    review: {
      no_price_row: 'This display shows no price per liter to check against.',
      decimal_point_inferred: 'The decimal point was not read and was restored.',
      low_confidence: 'The digits were hard to read.',
    },
    // Why nothing was returned.
    why: {
      parse_failed: 'No display was found in the frame.',
      amount_mismatch: 'The numbers on the display did not add up.',
      low_confidence: 'The digits were too unclear to trust.',
      conflicting_readings: 'Two different readings were possible.',
      liters_not_confirmed: 'The liters could not be confirmed on a second read.',
      volume_out_of_range: 'The liters read was outside the expected range.',
      volume_wrong_decimals: 'The liters did not have the expected decimals.',
      amount_not_2_decimals: 'The total did not have the expected decimals.',
      price_not_a_fuel_grade: 'The price is not a known fuel price.',
    },
    q_right: 'Is this what the pump shows?',
    q_optional: 'Optional: type the liters shown on the pump.',
    q_what: 'What does the pump show?',
    saved: 'Saved. Thank you.', not_saved: 'Could not save.',
    bad_number: 'Type the liters as a number, for example 22.93',
    yes: 'Yes', no: 'No', save: 'Save', placeholder: 'Liters on the pump',
    no_server: 'Could not reach the server. Check the connection and try again.',
    no_server_short: 'Could not reach the server.',
    refused: 'The server refused the picture.',
    too_large: 'The picture is too large.',
    not_image: 'That file is not a readable picture.',
    too_many: 'Too many attempts. Try again in a few minutes.',
  },
  ar: {
    starting: 'جارٍ تشغيل الكاميرا…',
    hint_fit: 'ضع شاشة المضخة داخل الإطار',
    hint_photo: 'التقط صورة لشاشة المضخة',
    hint_again: 'اضغط «مسح مجدداً» لقراءة جديدة',
    captured: 'تم الالتقاط. يمكنك إنزال الهاتف.',
    reading_photo: 'جارٍ قراءة الصورة…',
    scan: 'مسح', scan_again: 'مسح مجدداً', reading: 'جارٍ القراءة…', seconds: 'ث',
    take_photo: 'التقط صورة',
    no_camera_1: 'عرض الكاميرا المباشر غير متاح هنا.',
    no_camera_2: 'التقط صورة لشاشة المضخة بدلاً من ذلك.',
    unit: 'لتر', zoom: 'تكبير', history: 'سجل المسح', other_language: 'EN',
    verified: 'تم التحقق', not_verified: 'غير مؤكد', retake: 'أعد المحاولة', error: 'خطأ',
    no_reading: 'لا توجد قراءة', not_sent: 'لم تُرسل',
    read_in: (s) => 'تمت القراءة في ' + s + ' ث.',
    unreadable: 'تعذّرت قراءة الشاشة.',
    try_again: 'اقترب أو كبّر الصورة ثم امسح مجدداً.',
    review: {
      no_price_row: 'لا تعرض هذه الشاشة سعر اللتر للتحقق من القراءة.',
      decimal_point_inferred: 'لم تُقرأ الفاصلة العشرية وتمت إضافتها.',
      low_confidence: 'كانت الأرقام صعبة القراءة.',
    },
    why: {
      parse_failed: 'لم يُعثر على شاشة داخل الإطار.',
      amount_mismatch: 'الأرقام على الشاشة غير متطابقة حسابياً.',
      low_confidence: 'الأرقام غير واضحة بما يكفي للوثوق بها.',
      conflicting_readings: 'ظهرت قراءتان مختلفتان محتملتان.',
      liters_not_confirmed: 'تعذّر تأكيد اللترات في قراءة ثانية.',
      volume_out_of_range: 'اللترات المقروءة خارج النطاق المتوقع.',
      volume_wrong_decimals: 'عدد الخانات العشرية للترات غير متوقع.',
      amount_not_2_decimals: 'عدد الخانات العشرية للمبلغ غير متوقع.',
      price_not_a_fuel_grade: 'السعر ليس من أسعار الوقود المعروفة.',
    },
    q_right: 'هل هذا ما تعرضه المضخة؟',
    q_optional: 'اختياري: اكتب اللترات المعروضة على المضخة.',
    q_what: 'ماذا تعرض المضخة؟',
    saved: 'تم الحفظ. شكراً لك.', not_saved: 'تعذّر الحفظ.',
    bad_number: 'اكتب اللترات كرقم، مثل 22.93',
    yes: 'نعم', no: 'لا', save: 'حفظ', placeholder: 'اللترات على المضخة',
    no_server: 'تعذّر الاتصال بالخادم. تحقق من الاتصال وحاول مجدداً.',
    no_server_short: 'تعذّر الاتصال بالخادم.',
    refused: 'رفض الخادم الصورة.',
    too_large: 'الصورة كبيرة جداً.',
    not_image: 'الملف ليس صورة مقروءة.',
    too_many: 'محاولات كثيرة. حاول بعد بضع دقائق.',
  },
};
// The server answers in English; these say the same thing in the chosen language.
const SERVER_ERRORS = { 400: 'not_image', 413: 'too_large', 422: 'bad_number', 429: 'too_many' };

let lang = 'en';
try {
  lang = localStorage.getItem('lang') || ((navigator.language || '').startsWith('ar') ? 'ar' : 'en');
} catch (err) { /* private browsing: stay with English */ }
if (!TEXT[lang]) lang = 'en';
const t = (key) => TEXT[lang][key];

// ---- state: live -> reading -> done -> live -------------------------------
function setState(state) {
  app.dataset.state = state;
  shoot.disabled = state === 'reading';
  if (state !== 'done') result.className = '';  // an earlier result goes away
  if (state === 'live' && app.dataset.mode !== 'photo') video.play().catch(() => {});
  paint();
}

// The words that depend on the state. Also run when the language changes.
function paint() {
  const state = app.dataset.state, mode = app.dataset.mode;
  if (mode === 'starting') hint.textContent = t('starting');
  else if (state === 'reading') hint.textContent = t(mode === 'photo' ? 'reading_photo' : 'captured');
  else if (mode === 'photo') hint.textContent = t('hint_photo');
  else hint.textContent = t(state === 'live' ? 'hint_fit' : 'hint_again');
  if (state !== 'reading') shootLabel.textContent = t(state === 'done' ? 'scan_again' : 'scan');
}

// ---- result ----------------------------------------------------------------
let shown = null;  // what the result card shows: { data, seconds } or { error }

function showResult(data, seconds) {
  shown = { data, seconds };
  result.className = 'show';
  paintResult();
  askFeedback(data);
}

function showError(key) {
  shown = { error: key };
  result.className = 'show';
  paintResult();
  feedback.hidden = true;
}

function paintResult() {
  if (!shown) return;
  if (shown.error) {
    result.className = result.className && 'show error';
    resultUnit.hidden = true;
    resultValue.textContent = t('not_sent');
    resultChip.textContent = t('error');
    resultNote.textContent = t(shown.error);
    return;
  }
  const { data, seconds } = shown;
  result.className = result.className && 'show ' + data.status;
  resultUnit.hidden = !data.liters;
  if (data.status === 'accepted') {
    resultValue.textContent = data.liters;
    resultChip.textContent = t('verified');
    resultNote.textContent = seconds === undefined ? '' : t('read_in')(seconds.toFixed(1));
  } else if (data.status === 'review') {
    resultValue.textContent = data.liters;
    resultChip.textContent = t('not_verified');
    resultNote.textContent = data.flags.map((f) => t('review')[f] || f).join(' ');
  } else {
    resultValue.textContent = t('no_reading');
    resultChip.textContent = t('retake');
    const why = data.flags.map((f) => t('why')[f]).filter(Boolean)[0] || t('unreadable');
    resultNote.textContent = why + ' ' + t('try_again');
  }
}

async function send(blob) {
  setState('reading');
  // Live meter: counts up on the button while the scan is running.
  const started = performance.now();
  const elapsed = () => (performance.now() - started) / 1000;
  shootLabel.textContent = t('reading');
  const meter = setInterval(() => {
    shootLabel.textContent = t('reading') + ' ' + elapsed().toFixed(1) + ' ' + t('seconds');
  }, 100);

  const body = new FormData();
  body.append('photo', blob, 'scan.jpg');
  try {
    const res = await fetch('/scan', { method: 'POST', body });
    const data = await res.json();
    if (res.ok) showResult(data, elapsed());
    else showError(SERVER_ERRORS[res.status] || 'refused');
  } catch (err) {
    showError('no_server');
  }
  clearInterval(meter);
  setState('done');
}

// ---- Was this right? -------------------------------------------------------
const feedback = $('feedback'), question = $('feedback-question');
const yesNo = $('feedback-buttons'), entry = $('feedback-entry'), trueLiters = $('true-liters');
let currentScan = null;  // { id, liters } of the result on screen
let asked = 'q_right';   // which line the question shows

function ask(key) {
  asked = key;
  question.textContent = t(key);
}

function askFeedback(data) {
  currentScan = data.id ? { id: data.id, liters: data.liters } : null;
  feedback.hidden = !currentScan;  // nothing to attach an answer to if scans are not stored
  if (!currentScan) return;
  trueLiters.value = '';
  if (data.liters) {
    ask('q_right');
    yesNo.hidden = false;
    entry.hidden = true;
  } else {
    ask('q_optional');
    yesNo.hidden = true;
    entry.hidden = false;
  }
}

async function sendFeedback(correct, typed) {
  try {
    const res = await fetch('/scans/' + currentScan.id + '/feedback', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ correct, true_liters: typed || null }),
    });
    if (!res.ok) { ask(SERVER_ERRORS[res.status] || 'not_saved'); return; }
    trueLiters.blur();
    ask('saved');
    yesNo.hidden = true;
    entry.hidden = true;
  } catch (err) {
    ask('no_server_short');
  }
}

function saveTyped() {
  // After "No" the value may be left empty; after a retake it is the whole point.
  if (!currentScan.liters && !trueLiters.value.trim()) { trueLiters.focus(); return; }
  sendFeedback(false, trueLiters.value.trim());
}

$('feedback-yes').addEventListener('click', () => sendFeedback(true, null));
$('feedback-no').addEventListener('click', () => {
  ask('q_what');
  yesNo.hidden = true;
  entry.hidden = false;
  trueLiters.focus();
});
$('feedback-save').addEventListener('click', saveTyped);
trueLiters.addEventListener('keydown', (e) => { if (e.key === 'Enter') saveTyped(); });

// ---- language --------------------------------------------------------------
function applyLanguage() {
  document.documentElement.lang = lang;
  document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
  document.querySelectorAll('[data-t]').forEach((el) => { el.textContent = t(el.dataset.t); });
  document.querySelectorAll('[data-t-label]').forEach((el) => { el.setAttribute('aria-label', t(el.dataset.tLabel)); });
  document.querySelectorAll('[data-t-placeholder]').forEach((el) => { el.placeholder = t(el.dataset.tPlaceholder); });
  $('lang').textContent = t('other_language');
  $('lang').setAttribute('aria-label', lang === 'ar' ? 'English' : 'العربية');
  paint();
  paintResult();
  question.textContent = t(asked);
  aimZoom();  // the box does not move, but be sure after the layout mirrored
}

$('lang').addEventListener('click', () => {
  lang = lang === 'ar' ? 'en' : 'ar';
  try { localStorage.setItem('lang', lang); } catch (err) { /* not remembered, still switched */ }
  applyLanguage();
});

// Keep the sheet above the on-screen keyboard while the liters box is in use.
if (window.visualViewport) {
  const lift = () => {
    const covered = window.innerHeight - visualViewport.height - visualViewport.offsetTop;
    sheet.style.transform = covered > 1 ? 'translateY(' + -covered + 'px)' : '';
  };
  visualViewport.addEventListener('resize', lift);
  visualViewport.addEventListener('scroll', lift);
}

// ---- camera ----------------------------------------------------------------
function usePhotoMode() {
  app.dataset.mode = 'photo';
  video.hidden = true;
  roi.hidden = true;
  $('zoom-row').hidden = true;
  shoot.hidden = true;
  $('no-camera').hidden = false;
  $('photo-button').hidden = false;
  setState('live');
}

async function startLive() {
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) { usePhotoMode(); return; }
  try {
    // Ask for the camera's highest resolution: zooming in then still leaves
    // enough pixels on the digits.
    video.srcObject = await navigator.mediaDevices.getUserMedia({
      audio: false,
      video: { facingMode: { ideal: 'environment' }, width: { ideal: 3840 }, height: { ideal: 2160 } },
    });
    video.hidden = false;
    await video.play();
  } catch (err) {
    usePhotoMode();
    return;
  }
  app.dataset.mode = 'live';
  roi.hidden = false;
  $('zoom-row').hidden = false;
  shoot.hidden = false;
  setUpZoom();
  setState('live');
}

// ---- zoom ------------------------------------------------------------------
// If the camera itself can zoom, that is used: it is real, optical or sensor
// zoom. Otherwise the picture is enlarged on screen and the box simply covers
// a smaller part of the camera image. Either way the scan sends exactly what
// is inside the box.
const zoomSlider = $('zoom'), zoomValue = $('zoom-value');
let cameraZoom = null;  // { track } when the camera supports zoom

function setUpZoom() {
  const track = video.srcObject.getVideoTracks()[0];
  const caps = track.getCapabilities ? track.getCapabilities() : {};
  if (caps.zoom && caps.zoom.max > caps.zoom.min) {
    cameraZoom = { track };
    zoomSlider.min = caps.zoom.min;
    zoomSlider.max = Math.min(caps.zoom.max, 10);
    zoomSlider.value = caps.zoom.min;
  }
  aimZoom();
  setZoom(Number(zoomSlider.value));
}

// On-screen zoom grows the picture out of the centre of the box, so what is
// in the box stays in the box.
function aimZoom() {
  if (roi.hidden) return;
  const s = stage.getBoundingClientRect(), b = roi.getBoundingClientRect();
  video.style.transformOrigin = (b.left + b.width / 2 - s.left) + 'px ' + (b.top + b.height / 2 - s.top) + 'px';
}
window.addEventListener('resize', aimZoom);

function setZoom(z) {
  z = Math.min(Number(zoomSlider.max), Math.max(Number(zoomSlider.min), z));
  zoomSlider.value = z;
  zoomValue.textContent = z.toFixed(1) + '×';
  if (cameraZoom) {
    cameraZoom.track.applyConstraints({ advanced: [{ zoom: z }] }).catch(() => {});
  } else {
    video.style.transform = z > 1 ? 'scale(' + z + ')' : '';
  }
}

zoomSlider.addEventListener('input', () => setZoom(Number(zoomSlider.value)));

// Pinch with two fingers on the camera view to zoom.
let pinch = null;  // { distance, zoom } at the start of the gesture
const spread = (t) => Math.hypot(t[0].clientX - t[1].clientX, t[0].clientY - t[1].clientY);
stage.addEventListener('touchstart', (e) => {
  if (e.touches.length === 2) pinch = { distance: spread(e.touches), zoom: Number(zoomSlider.value) };
}, { passive: true });
stage.addEventListener('touchmove', (e) => {
  if (pinch && e.touches.length === 2) {
    e.preventDefault();
    setZoom(pinch.zoom * spread(e.touches) / pinch.distance);
  }
}, { passive: false });
stage.addEventListener('touchend', () => { pinch = null; });
// Safari's own page zoom would fight the pinch above.
document.addEventListener('gesturestart', (e) => e.preventDefault());

// ---- capture ---------------------------------------------------------------
// The part of the camera frame that is inside the box, in camera pixels.
function boxInFrame() {
  const v = video.getBoundingClientRect();  // on screen, on-screen zoom included
  const b = roi.getBoundingClientRect();
  // "cover": the frame is scaled to fill the screen and centred, and whatever
  // sticks out at two sides is cut off.
  const scale = Math.max(v.width / video.videoWidth, v.height / video.videoHeight);
  const left = v.left + (v.width - video.videoWidth * scale) / 2;
  const top = v.top + (v.height - video.videoHeight * scale) / 2;
  const m = b.width * MARGIN;
  const x = Math.max(0, (b.left - m - left) / scale);
  const y = Math.max(0, (b.top - m - top) / scale);
  return {
    x, y,
    w: Math.min(video.videoWidth - x, (b.width + 2 * m) / scale),
    h: Math.min(video.videoHeight - y, (b.height + 2 * m) / scale),
  };
}

shoot.addEventListener('click', () => {
  if (app.dataset.state === 'done') { setState('live'); return; }  // "Scan again"

  // The picture is taken at this instant. Freeze the view so it is clear
  // the phone no longer needs to be held on the display.
  video.pause();
  const flash = $('flash');
  flash.classList.remove('go');
  void flash.offsetWidth;  // restart the animation
  flash.classList.add('go');

  const { x, y, w, h } = boxInFrame();
  const shrink = Math.min(1, SEND_MAX_SIDE / Math.max(w, h));
  const canvas = document.createElement('canvas');
  canvas.width = Math.round(w * shrink);
  canvas.height = Math.round(h * shrink);
  canvas.getContext('2d').drawImage(video, x, y, w, h, 0, 0, canvas.width, canvas.height);
  setState('reading');
  canvas.toBlob((blob) => send(blob), 'image/jpeg', 0.92);
});

// Photo mode has no "Scan again" step: the result stays on screen and the
// button is ready for the next photo straight away.
$('photo').addEventListener('change', async (e) => {
  if (e.target.files[0]) await send(e.target.files[0]);
  e.target.value = '';
});

applyLanguage();
startLive();
</script>
</body>
